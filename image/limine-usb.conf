# The stick: C: is its second partition. The menu stays hidden; a key held
# or pressed in the first second shows it, with the start that goes back to
# the version before the last update and the start that saves nothing.
timeout: 1
quiet: yes
interface_branding: Arctic
interface_help_hidden: yes

/Arctic
    protocol: linux
    path: boot():/EFI/Arctic/vmlinuz
    module_path: boot():/EFI/Arctic/initrd.img
    cmdline: console=ttyS0,115200 loglevel=6 arctic.dev=1 arctic.root=PARTUUID=@PARTUUID@

/Arctic, undo the last update
    protocol: linux
    path: boot():/EFI/Arctic/vmlinuz
    module_path: boot():/EFI/Arctic/initrd.img
    cmdline: console=ttyS0,115200 loglevel=6 arctic.dev=1 arctic.root=PARTUUID=@PARTUUID@ arctic.rollback=1

/Arctic, nothing saved
    protocol: linux
    path: boot():/EFI/Arctic/vmlinuz
    module_path: boot():/EFI/Arctic/initrd.img
    cmdline: console=ttyS0,115200 loglevel=6 arctic.dev=1 arctic.root=PARTUUID=@PARTUUID@ arctic.live=1
