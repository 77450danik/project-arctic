# Arctic installed on an internal disk, its boot files in \EFI\Arctic on the
# EFI system partition next to Windows' (tools/wsl/make-install-set.sh). The
# firmware's "ARCTIC" entry starts shim there. Nothing waits: the menu stays
# hidden, and a key held while the machine starts shows it (Arctic's patch
# 0002 to Limine), with the start that goes back to the version before the
# last update and the start that saves nothing.
timeout: 0
quiet: yes
interface_branding: Arctic
interface_help_hidden: yes

/Arctic
    protocol: linux
    path: boot():/EFI/Arctic/vmlinuz
    module_path: boot():/EFI/Arctic/initrd.img
    cmdline: console=ttyS0,115200 loglevel=6 log_buf_len=4M arctic.dev=1 arctic.root=PARTUUID=@PARTUUID@

/Arctic, undo the last update
    protocol: linux
    path: boot():/EFI/Arctic/vmlinuz
    module_path: boot():/EFI/Arctic/initrd.img
    cmdline: console=ttyS0,115200 loglevel=6 log_buf_len=4M arctic.dev=1 arctic.root=PARTUUID=@PARTUUID@ arctic.rollback=1

/Arctic, nothing saved
    protocol: linux
    path: boot():/EFI/Arctic/vmlinuz
    module_path: boot():/EFI/Arctic/initrd.img
    cmdline: console=ttyS0,115200 loglevel=6 log_buf_len=4M arctic.dev=1 arctic.root=PARTUUID=@PARTUUID@ arctic.live=1
