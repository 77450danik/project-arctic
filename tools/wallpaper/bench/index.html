<!doctype html><meta charset=utf-8><title>webgpu bench</title>
<style>html,body{margin:0;background:#000}canvas{width:100vw;height:100vh;display:block}</style>
<canvas id=c></canvas><script>
// A fragment shader of fixed cost on every pixel: frames per second measure
// how fast WebGPU draws and presents in this browser
window.bench = (async () => {
  const a = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  const d = await a.requestDevice();
  const c = document.getElementById('c');
  c.width = 1920; c.height = 1080;
  const ctx = c.getContext('webgpu');
  const fmt = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device: d, format: fmt, alphaMode: 'opaque' });
  const m = d.createShaderModule({ code: `
    @group(0) @binding(0) var<uniform> t: f32;
    @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
      let p = array(vec2f(-1,-1), vec2f(3,-1), vec2f(-1,3)); return vec4f(p[i], 0, 1); }
    @fragment fn fs(@builtin(position) p: vec4f) -> @location(0) vec4f {
      var v = p.xy / 1080.0; var s = 0.0;
      for (var i = 0; i < 96; i++) { v = vec2f(sin(v.y * 3.1 + t), cos(v.x * 2.7 - t)) + v * 0.5; s += v.x * v.y; }
      return vec4f(fract(s), fract(s * 0.7), fract(s * 0.3), 1); }` });
  const pl = d.createRenderPipeline({ layout: 'auto', vertex: { module: m, entryPoint: 'vs' },
    fragment: { module: m, entryPoint: 'fs', targets: [{ format: fmt }] } });
  const ub = d.createBuffer({ size: 4, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const bg = d.createBindGroup({ layout: pl.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ub } }] });
  let frames = 0; const t0 = performance.now();
  await new Promise(done => {
    const frame = (now) => {
      d.queue.writeBuffer(ub, 0, new Float32Array([now / 1000]));
      const e = d.createCommandEncoder();
      const r = e.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store' }] });
      r.setPipeline(pl); r.setBindGroup(0, bg); r.draw(3); r.end();
      d.queue.submit([e.finish()]); frames++;
      if (now - t0 < 6000) requestAnimationFrame(frame); else done();
    };
    requestAnimationFrame(frame);
  });
  await d.queue.onSubmittedWorkDone();
  const s = (performance.now() - t0) / 1000;
  return `${(frames / s).toFixed(1)} fps, ${a.info.vendor} ${a.info.architecture} ${a.info.description || ''}`;
})();
</script>
