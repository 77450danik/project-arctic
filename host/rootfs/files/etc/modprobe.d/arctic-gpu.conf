# Radeon HD 7000 and R7/R9 200 (GCN 1.0 and 1.1) go to amdgpu, which gives
# them Vulkan (radv) and variable refresh; radeon keeps the older cards
options amdgpu si_support=1 cik_support=1
options radeon si_support=0 cik_support=0

# NVIDIA's driver drives the display itself and takes the screen over from
# the firmware's framebuffer
options nvidia_drm modeset=1 fbdev=1
