# Radeon HD 7000 and R7/R9 200 (GCN 1.0 and 1.1) go to amdgpu, which gives
# them Vulkan (radv) and variable refresh; radeon keeps the older cards
options amdgpu si_support=1 cik_support=1
options radeon si_support=0 cik_support=0

# NVIDIA's driver drives the display itself and takes the screen over from
# the firmware's framebuffer
options nvidia_drm modeset=1 fbdev=1

# NVIDIA's driver, not nouveau, for every card it drives; arctic-gpu loads
# nouveau by name for the cards it does not (Kepler and older)
blacklist nouveau
blacklist nova_core
blacklist nova_drm
softdep nvidia post: nvidia-uvm nvidia-drm
# Video memory survives fast startup and hibernation: arctic-init tells the
# driver through /proc/driver/nvidia/suspend, and the driver keeps it in a
# file on /tmp (in memory, so in the image; /var/tmp is read-only here)
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/tmp
