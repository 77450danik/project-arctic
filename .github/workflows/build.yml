name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each kind of job waits for the same job of an earlier push instead of
# cancelling it, so a kernel or Wine build that finishes leaves its cache for
# the next one; different kinds run side by side, so a ReactOS change is built
# while Wine still is.

permissions:
  contents: write

jobs:
  kernel:
    concurrency:
      group: kernel-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "key=kernel-${{ hashFiles('kernel/**', 'ci/build-kernel.sh', 'ci/arch-prep.sh', 'ci/mkpanic.py') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: out/kernel
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash ci/free-disk.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        run: docker run --rm -v "$PWD:/work" archlinux:latest bash /work/ci/build-kernel.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" out
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/kernel
          key: ${{ steps.key.outputs.key }}
      # the kernel on its own, for an image built locally (tools/wsl/build-image.sh)
      - if: steps.cache.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: out/kernel
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/kernel/
          retention-days: 7

  wine:
    concurrency:
      group: wine-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "key=wine-${{ hashFiles('runtime/WINE_VERSION', 'runtime/wine/**', 'ci/build-wine.sh', 'ci/arch-prep.sh') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: out/wine
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash ci/free-disk.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        run: docker run --rm -v "$PWD:/work" archlinux:latest bash /work/ci/build-wine.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" out
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/wine
          key: ${{ steps.key.outputs.key }}

  reactos:
    concurrency:
      group: reactos-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-22.04 # the runner ReactOS's own CI builds RosBE on
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: |
          echo "key=reactos-${{ hashFiles('runtime/reactos/**', 'ci/build-reactos.sh') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: out/reactos
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        id: rosbe
        uses: actions/cache/restore@v4
        with:
          path: ~/reactos/RosBE
          key: rosbe-${{ runner.os }}-ea42b03-generic # ROSBE_SCRIPT_SHA256 in ci/build-reactos.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y ninja-build texinfo
      - if: steps.cache.outputs.cache-hit != 'true' && steps.rosbe.outputs.cache-hit != 'true'
        run: bash ci/build-reactos.sh toolchain
      - if: steps.cache.outputs.cache-hit != 'true' && steps.rosbe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/reactos/RosBE
          key: rosbe-${{ runner.os }}-ea42b03-generic
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash ci/build-reactos.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/reactos
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: reactos-shell
          path: out/reactos/
          retention-days: 14
          if-no-files-found: ignore

  image:
    needs: [kernel, wine, reactos]
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/free-disk.sh
      - uses: actions/cache/restore@v4
        with:
          path: out/kernel
          key: kernel-${{ hashFiles('kernel/**', 'ci/build-kernel.sh', 'ci/arch-prep.sh', 'ci/mkpanic.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: out/wine
          key: wine-${{ hashFiles('runtime/WINE_VERSION', 'runtime/wine/**', 'ci/build-wine.sh', 'ci/arch-prep.sh') }}
          fail-on-cache-miss: true
      # the shell, the theme and the keyboard layouts of C:: from the cache, or
      # from this run's build when the cache could not be saved (a key another
      # run reserved and never wrote)
      - id: reactos
        uses: actions/cache/restore@v4
        with:
          path: out/reactos
          key: reactos-${{ hashFiles('runtime/reactos/**', 'ci/build-reactos.sh') }}
      - if: steps.reactos.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: reactos-shell
          path: out/reactos

      - name: Host root filesystem and NT prefix
        run: docker run --rm --privileged -v "$PWD:/work" archlinux:latest bash /work/ci/build-rootfs.sh
      - name: "C: image (NTFS)"
        run: bash ci/make-windows-img.sh
      # Limine is signed with the Arctic Secure Boot key (ci/sign-efi.sh)
      - name: ISO
        env:
          ARCTIC_SB_KEY: ${{ secrets.ARCTIC_SB_KEY }}
        run: docker run --rm -e ARCTIC_SB_KEY -e GITHUB_ACTIONS -v "$PWD:/work" archlinux:latest bash /work/ci/build-image.sh
      - name: USB image
        run: docker run --rm -v "$PWD:/work" archlinux:latest bash /work/ci/make-usb-img.sh
      - run: sudo chown "$(id -u):$(id -g)" out out/arctic.iso out/arctic-usb.img

      - name: Boot test
        run: bash ci/smoke-test.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: out/test/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish images
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in out/arctic.iso out/arctic-usb.img; do
            [ "$(stat -c %s "$f")" -lt 2147483648 ] || { echo "$f is over the 2 GiB release asset limit"; exit 1; }
          done
          notes="Commit ${GITHUB_SHA::7}. Kernel $(cat out/kernel/release), $(cat out/wine/version).

          arctic-usb.img goes to a stick as it is (dd, or Rufus in DD mode) and boots both from UEFI and from BIOS/CSM. arctic.iso is for discs and virtual machines.

          Secure Boot may stay on. The first time on each PC, shim opens MokManager: Enroll key from disk, ARCTIC.cer, Continue, Yes, Reboot (docs/boot.md)."
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev out/arctic.iso out/arctic-usb.img --prerelease --target "$GITHUB_SHA" \
            --title "Arctic dev ${GITHUB_SHA::7}" --notes "$notes"
