name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "key=kernel-${{ hashFiles('kernel/**', 'ci/build-kernel.sh', 'ci/arch-prep.sh') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: out/kernel
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash ci/free-disk.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        run: docker run --rm -v "$PWD:/work" archlinux:latest bash /work/ci/build-kernel.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" out
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/kernel
          key: ${{ steps.key.outputs.key }}

  wine:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "key=wine-${{ hashFiles('runtime/**', 'ci/build-wine.sh', 'ci/arch-prep.sh') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: out/wine
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash ci/free-disk.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        run: docker run --rm -v "$PWD:/work" archlinux:latest bash /work/ci/build-wine.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" out
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/wine
          key: ${{ steps.key.outputs.key }}

  image:
    needs: [kernel, wine]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/free-disk.sh
      - uses: actions/cache/restore@v4
        with:
          path: out/kernel
          key: kernel-${{ hashFiles('kernel/**', 'ci/build-kernel.sh', 'ci/arch-prep.sh') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: out/wine
          key: wine-${{ hashFiles('runtime/**', 'ci/build-wine.sh', 'ci/arch-prep.sh') }}
          fail-on-cache-miss: true

      - name: Host root filesystem and NT prefix
        run: docker run --rm --privileged -v "$PWD:/work" archlinux:latest bash /work/ci/build-rootfs.sh
      - name: "C: image (NTFS)"
        run: bash ci/make-windows-img.sh
      - name: ISO
        run: docker run --rm -v "$PWD:/work" archlinux:latest bash /work/ci/build-image.sh
      - run: sudo chown "$(id -u):$(id -g)" out out/arctic.iso

      - name: Boot test
        run: bash ci/smoke-test.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: out/test/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish ISO
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          size=$(stat -c %s out/arctic.iso)
          [ "$size" -lt 2147483648 ] || { echo "ISO is over the 2 GiB release asset limit"; exit 1; }
          notes="Commit ${GITHUB_SHA::7}. Kernel $(cat out/kernel/release), $(cat out/wine/version)."
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev out/arctic.iso --prerelease --target "$GITHUB_SHA" \
            --title "Arctic dev ${GITHUB_SHA::7}" --notes "$notes"
