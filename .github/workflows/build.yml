name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each kind of job waits for the same job of an earlier push instead of
# cancelling it, so a kernel or Wine build that finishes leaves its cache for
# the next one; different kinds run side by side, so a ReactOS change is built
# while Wine still is.

permissions:
  contents: write

jobs:
  kernel:
    concurrency:
      group: kernel-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "key=kernel-${{ hashFiles('kernel/**', 'ci/build-kernel.sh', 'ci/arch-prep.sh', 'ci/mkpanic.py') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: out/kernel
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash ci/free-disk.sh
      # the compiler's results of the last kernel build: only what changed is compiled again
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache/kernel
          key: kernel-ccache-${{ github.run_id }}
          restore-keys: kernel-ccache-
      - if: steps.cache.outputs.cache-hit != 'true'
        run: docker run --rm -e CCACHE_DIR=/work/.ccache/kernel -v "$PWD:/work" archlinux:latest bash /work/ci/build-kernel.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" out .ccache
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/kernel
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache/kernel
          key: kernel-ccache-${{ github.run_id }}
      # the kernel on its own, for an image built locally (tools/wsl/build-image.sh)
      - if: steps.cache.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: out/kernel
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/kernel/
          retention-days: 7

  wine:
    concurrency:
      group: wine-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "key=wine-${{ hashFiles('runtime/WINE_VERSION', 'runtime/wine/**', 'ci/build-wine.sh', 'ci/arch-prep.sh') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: out/wine
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash ci/free-disk.sh
      # the compiler's results of the last Wine build: a changed patch or
      # module compiles only its own files again, not all of Wine
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache/wine
          key: wine-ccache-${{ github.run_id }}
          restore-keys: wine-ccache-
      - if: steps.cache.outputs.cache-hit != 'true'
        run: docker run --rm -e CCACHE_DIR=/work/.ccache/wine -v "$PWD:/work" archlinux:latest bash /work/ci/build-wine.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" out .ccache
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/wine
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache/wine
          key: wine-ccache-${{ github.run_id }}

  reactos:
    concurrency:
      group: reactos-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-22.04 # the runner ReactOS's own CI builds RosBE on
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: |
          echo "key=reactos-${{ hashFiles('runtime/reactos/**', 'ci/build-reactos.sh') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: out/reactos
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        id: rosbe
        uses: actions/cache/restore@v4
        with:
          path: ~/reactos/RosBE
          key: rosbe-${{ runner.os }}-ea42b03-generic # ROSBE_SCRIPT_SHA256 in ci/build-reactos.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y ninja-build texinfo
      - if: steps.cache.outputs.cache-hit != 'true' && steps.rosbe.outputs.cache-hit != 'true'
        run: bash ci/build-reactos.sh toolchain
      - if: steps.cache.outputs.cache-hit != 'true' && steps.rosbe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/reactos/RosBE
          key: rosbe-${{ runner.os }}-ea42b03-generic
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash ci/build-reactos.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/reactos
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: reactos-shell
          path: out/reactos/
          retention-days: 14
          if-no-files-found: ignore

  image:
    needs: [kernel, wine, reactos]
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # the whole history: the build number is the number of commits
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash ci/free-disk.sh
      - uses: actions/cache/restore@v4
        with:
          path: out/kernel
          key: kernel-${{ hashFiles('kernel/**', 'ci/build-kernel.sh', 'ci/arch-prep.sh', 'ci/mkpanic.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: out/wine
          key: wine-${{ hashFiles('runtime/WINE_VERSION', 'runtime/wine/**', 'ci/build-wine.sh', 'ci/arch-prep.sh') }}
          fail-on-cache-miss: true
      # the shell, the theme and the keyboard layouts of C:: from the cache, or
      # from this run's build when the cache could not be saved (a key another
      # run reserved and never wrote)
      - id: reactos
        uses: actions/cache/restore@v4
        with:
          path: out/reactos
          key: reactos-${{ hashFiles('runtime/reactos/**', 'ci/build-reactos.sh') }}
      - if: steps.reactos.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: reactos-shell
          path: out/reactos

      # the build's number and date for the About dialog: the container has no git
      - name: Host root filesystem and NT prefix
        run: |
          export ARCTIC_BUILD=$(git rev-list --count HEAD) ARCTIC_COMMIT=$(git rev-parse --short=7 HEAD)
          export ARCTIC_BUILD_DATE=$(date -u +%Y-%m-%d)
          docker run --rm --privileged -e ARCTIC_BUILD -e ARCTIC_COMMIT -e ARCTIC_BUILD_DATE -v "$PWD:/work" \
              archlinux:latest bash /work/ci/build-rootfs.sh
      - name: "C: image (NTFS)"
        run: bash ci/make-windows-img.sh
      # Limine is signed with the Arctic Secure Boot key (ci/sign-efi.sh), once
      # for the ISO and once for the stick, each with its own config. Privileged:
      # ntfs-3g (FUSE) puts the host on the stick's C:
      - name: ISO and USB image
        env:
          ARCTIC_SB_KEY: ${{ secrets.ARCTIC_SB_KEY }}
        run: |
          docker run --rm --privileged -e ARCTIC_SB_KEY -e GITHUB_ACTIONS -v "$PWD:/work" archlinux:latest \
              bash -c 'bash /work/ci/build-image.sh && bash /work/ci/make-usb-img.sh'
      - run: sudo chown "$(id -u):$(id -g)" out out/arctic.iso out/arctic-usb.img

      - name: Boot test
        run: bash ci/smoke-test.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: out/test/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish images
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the stick's image is bigger than GitHub takes; Rufus and Etcher write the .xz as it is
          xz -T0 -6 -k -f out/arctic-usb.img
          for f in out/arctic.iso out/arctic-usb.img.xz; do
            [ "$(stat -c %s "$f")" -lt 2147483648 ] || { echo "$f is over the 2 GiB release asset limit"; exit 1; }
          done
          notes="Commit ${GITHUB_SHA::7}. Kernel $(cat out/kernel/release), $(cat out/wine/version).

          arctic-usb.img.xz goes to a stick as it is (Rufus, balenaEtcher, or xzcat | dd) and boots both from UEFI and from BIOS/CSM. The stick keeps what is written to it: C: is a partition on it. Hold a key during the first second for the start that saves nothing. arctic.iso is for discs and virtual machines and saves nothing.

          Secure Boot may stay on. The first time on each PC, shim opens MokManager: Enroll key from disk, ARCTIC.cer, Continue, Yes, Reboot (docs/boot.md)."
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev out/arctic.iso out/arctic-usb.img.xz --prerelease --target "$GITHUB_SHA" \
            --title "Arctic dev ${GITHUB_SHA::7}" --notes "$notes"

  # Old caches go, so that the compiler caches do not push the builds out of
  # GitHub's 10 GB: of the compiler caches only the newest of each stays, of
  # the builds those some run used in the last two days, and RosBE always
  prune-caches:
    needs: [image]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/actions/caches?per_page=100" \
              --jq '.actions_caches[] | [.id, .key, .created_at, .last_accessed_at] | @tsv' > caches.tsv
          for kind in wine-ccache kernel-ccache; do
            awk -F'\t' -v k="$kind-" 'index($2, k) == 1' caches.tsv | sort -t$'\t' -k3 -r | tail -n +2 | cut -f1
          done > delete.txt
          cutoff=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%S)
          awk -F'\t' -v c="$cutoff" '$2 !~ /-ccache-/ && $2 !~ /^rosbe-/ && $4 < c { print $1 }' caches.tsv >> delete.txt
          echo "$(wc -l < delete.txt) of $(wc -l < caches.tsv) caches go"
          while read -r id; do gh api -X DELETE "repos/$REPO/actions/caches/$id" || true; done < delete.txt
