<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><title>Шари</title>
<style>
body { font: 14px sans-serif; margin: 10px; }
.box { position: absolute; width: 120px; height: 80px; color: #fff; padding: 4px; }
.a { left: 10px; top: 10px; background: #c33; z-index: 3; }
.b { left: 60px; top: 40px; background: #36c; z-index: 1; }
.c { left: 110px; top: 70px; background: #3a3; }
.bubble { position: absolute; left: 300px; top: 10px; z-index: 100; background: #fff; border: 1px solid #ccc; }
.veil { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 100; background: #000; opacity: 0.1; }
.inner { position: relative; z-index: 100; width: 200px; height: 120px; background: #fc6; }
.neg { position: absolute; left: 10px; top: 200px; width: 300px; height: 40px; background: #ddd; z-index: -1; }
</style></head><body>
<div class="box a">червоний z=3</div><div class="box b">синій z=1</div><div class="box c">зелений auto</div>
<div class="bubble"><div class="veil"></div><div class="inner">жовтий над вуаллю</div></div>
<div class="neg"></div><p style="margin-top:205px">текст над сірим блоком з z-index: -1</p>
</body></html>
